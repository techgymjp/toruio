name: iOS build check

# iOS 版が Xcode でビルドできるかを確認する（署名なし・シミュレーター向け）。
# App Store に出すビルドは、手元の Mac の Xcode で作る（docs/IOS_BUILD.md）
on:
  push:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'vendor/**'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Copy web assets into the iOS project
        run: |
          npm run build
          npx cap sync ios

      # bash は pipefail で動くので、xcodebuild が失敗すればこのステップも失敗する
      - name: Build for the simulator (no signing)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
