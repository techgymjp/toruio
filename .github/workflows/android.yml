name: Android build

on:
  push:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'vendor/**'
      - 'assets/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# 同じブランチで新しい push があったら、古いビルドは取り消して最新だけを作る
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 通常は 2〜3 分で終わる。途中で固まっても何時間も待たされないようにする
    timeout-minutes: 25
    permissions:
      contents: write   # Release に APK を載せるため
    env:
      # 署名鍵が登録されているときだけ Google Play 用の AAB を作る
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Set version name
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Copy web assets into the Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: toruio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # スマホから直接ダウンロードできるよう、既定ブランチのビルドは Release（android-latest）に載せる。
      # いつも同じ URL（releases/latest/download/toruio.apk）で最新版が取れるよう、
      # Release は消さずに APK だけ差し替える（ダウンロードできない時間を作らないため）
      - name: Publish APK to GitHub Release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk toruio.apk
          TITLE="目指せ盗塁王 Android 版 v${VERSION_NAME} (build ${VERSION_CODE})"
          cat > notes.md <<NOTES
          動作確認用の APK です（デバッグ署名・テスト広告。Google Play 版ではありません）。

          Android 端末でこのページを開き、下の toruio.apk をタップしてインストールしてください。
          途中で「提供元不明のアプリ」のインストールを許可する必要があります。

          ビルド: v${VERSION_NAME} (build ${VERSION_CODE}) / コミット ${GITHUB_SHA}
          NOTES
          if gh release view android-latest > /dev/null 2>&1; then
            gh release upload android-latest toruio.apk --clobber
            gh release edit android-latest --title "$TITLE" --notes-file notes.md --latest
          else
            gh release create android-latest toruio.apk --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
          fi

      - name: Decode upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Google Play 版だけ本番の広告 ID に切り替える（動作確認用 APK はテスト広告のまま）
      - name: Switch ads to production for the release build
        if: env.HAS_KEYSTORE == 'true'
        run: |
          ADMOB_MODE=production npm run build
          npx cap copy android

      - name: Build signed release AAB (Google Play)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: toruio-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
